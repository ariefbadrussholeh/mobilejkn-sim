<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Mobile JKN 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--blue:#0072BC;--blue-d:#005A96;--green:#00A651;--green-d:#007F3E;--bg:#F3F6F9;--ink:#12324F;--mut:#5F7388;--line:#DCE5EC;--mint:#E3F4EC;--sky:#E6F1FA}
html,body{margin:0;height:100%;background:#111827;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.btn,.chip,.mini,.who{font-family:"Baloo 2",Nunito,system-ui,sans-serif}
#app{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:#BFE3F5}
#app canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;z-index:10;pointer-events:none}
.scr.on{display:flex}
.pe{pointer-events:auto}
.ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
i[data-i]{display:inline-flex;font-style:normal}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:15px 18px;background:var(--green);color:#fff;font-weight:800;font-size:17px;box-shadow:0 5px 0 var(--green-d);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line);margin-top:14px}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(18,50,79,.14)}
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:none;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px 0;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 3px 12px rgba(18,50,79,.18)}
.sti{color:var(--blue)}
.dots{display:flex;gap:5px;align-items:center}.dots i{width:8px;height:8px;border-radius:50%;background:#C9D6E0}.dots i.on{background:var(--green)}.dots i.cur{background:var(--blue);width:20px;border-radius:6px}
#btnMute{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 12px rgba(18,50,79,.18);cursor:pointer;padding:0}
#btnMute .ico{width:20px;height:20px}
#cap{position:absolute;left:16px;right:16px;top:62px;z-index:20;background:#fff;color:var(--ink);border-radius:18px;padding:12px 16px;font-weight:700;font-size:14px;line-height:1.45;display:none;box-shadow:0 8px 24px rgba(18,50,79,.18);border-left:6px solid var(--green)}
#toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:#fff;color:#B3261E;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:6px solid #D93025;z-index:40;opacity:0;pointer-events:none;white-space:nowrap}
/* layar awal */
#sStart{justify-content:space-between}
.st-head{background:var(--blue);color:#fff;border-radius:0 0 32px 32px;padding:max(28px,env(safe-area-inset-top)) 24px 26px;text-align:center;pointer-events:auto;box-shadow:0 10px 30px rgba(0,50,100,.35)}
.st-logo{width:92px;height:92px;margin:0 auto 14px;border-radius:26px;background:#fff;display:grid;place-items:center}
.st-logo img{width:80px;height:80px;object-fit:contain}
.st-head h1{margin:0;font-size:28px;line-height:1.1;font-weight:800}
.st-head p{margin:8px auto 18px;max-width:280px;font-size:14px;line-height:1.5;color:#D6EAF8;font-weight:600}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--blue);font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 12px;font-family:"Baloo 2",Nunito,sans-serif}
.st-card{margin:0 16px max(20px,env(safe-area-inset-bottom));padding:22px 20px 20px;pointer-events:auto}
.st-card label{font-weight:800;font-size:13.5px;color:var(--ink)}
#inName{width:100%;box-sizing:border-box;margin:10px 0 6px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;font:700 16px Nunito,sans-serif;color:var(--ink);outline:none;background:#fff}
#inName:focus{border-color:var(--blue)}
/* intro + hasil */
.sheet{margin:0 16px max(20px,env(safe-area-inset-bottom));padding:18px 20px 20px}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:#00753A;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.mini{display:none;align-items:center;gap:6px;border:0;background:var(--sky);color:var(--blue);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
#sub{margin:12px 0 18px;font-size:17px;line-height:1.5;min-height:56px;font-weight:700;color:var(--ink)}
#timerBox{position:absolute;left:16px;right:16px;top:60px;padding:12px 16px 14px;z-index:15}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow small{font-weight:800;font-size:13px;color:var(--mut)}
.tci{color:var(--blue);align-self:center}.tci .ico{width:22px;height:22px}
#tTxt{font:800 30px/1 "Baloo 2",Nunito,sans-serif;color:var(--blue);min-width:38px;text-align:right}
#mission{font-weight:700;font-size:12.5px;line-height:1.35;color:var(--mut);text-align:right}
.bar{height:10px;border-radius:6px;background:var(--sky);overflow:hidden;margin-top:10px}
#tBar{height:100%;width:100%;background:var(--green);border-radius:6px}
.win-h{display:flex;align-items:center;gap:10px}
.win-ok{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.win-h b{font-weight:800;font-size:15px;color:#00753A}
#winTitle{margin:12px 0 8px;font-size:21px;font-weight:800;line-height:1.2}
#winEdu{margin:0 0 14px;font-size:14.5px;line-height:1.55;color:var(--mut);font-weight:600}
.note{background:var(--mint);color:#00753A;font-weight:800;border-radius:14px;padding:10px 14px;margin:0 0 18px;font-size:14px}

#phoneUI{position:absolute;left:50%;top:50%;opacity:0;pointer-events:auto;z-index:12;border-radius:1.5em;overflow:hidden;font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:#fff}
.jkn{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;color:#1b2a3a;position:relative}
.au{background:radial-gradient(60% 90% at 12% 15%,#22D3F3 0,transparent 60%),radial-gradient(55% 80% at 88% 10%,#A23FD8 0,transparent 60%),radial-gradient(70% 90% at 60% 105%,#1F6BE0 0,transparent 65%),#15318A}
.jkn .top{padding:.5em .8em .8em;color:#fff;flex:none}
.sbar{display:flex;justify-content:space-between;font-size:.62em;font-weight:600;margin-bottom:.5em}
.srow{display:flex;align-items:center;gap:.5em}
.logo{width:3em;height:3em;border-radius:.7em;background:#fff;display:grid;place-items:center;flex:none}
.logo img{width:2.6em;height:2.6em;object-fit:contain}
.sbx{flex:1;height:2.7em;border-radius:1.4em;background:rgba(255,255,255,.9);color:#334;font-size:.8em;display:flex;align-items:center;gap:.5em;padding:0 .9em;white-space:nowrap;overflow:hidden}
.av{width:2.7em;height:2.7em;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.2em;flex:none}
.gr{display:flex;justify-content:space-between;align-items:flex-start;padding:.5em .9em .1em;flex:none}
.gr b{font-size:1.15em}.gr p{margin:.1em 0 0;font-size:.78em;line-height:1.3;color:#334}
.ok{color:#2EAD5B}
.ver{font-weight:800;font-size:.75em;width:3.6em}
.hbody{flex:1;overflow:auto;padding:0 .4em .5em;scrollbar-width:none}
.aq{margin:.4em .2em .5em;padding:.6em;background:#fff;border-radius:1em;box-shadow:0 .2em 1em rgba(20,40,80,.18);display:flex;gap:.7em;align-items:center}
.aq .bg{width:4em;height:4em;border-radius:50%;background:#2FB58A;display:grid;place-items:center;font-size:2em;flex:none}
.aq h5{margin:0;color:#1B9AD9;font-size:1em;letter-spacing:.12em;font-weight:800}
.aq p{margin:.15em 0 .4em;font-size:.74em;line-height:1.3;color:#445;border-bottom:1px solid #d9dfe6;padding-bottom:.4em}
.btn2{border:0;border-radius:1.2em;padding:.5em 1.4em;color:#fff;font:700 .85em Poppins,system-ui,sans-serif;background:linear-gradient(180deg,#31C0EE,#1E6CC8);box-shadow:0 .15em .4em rgba(30,108,200,.4);cursor:pointer;outline-offset:2px}
.btn2.full{display:block;width:100%;margin-top:.9em;padding:.8em;font-size:1em;border-radius:1.6em}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:.2em 0}
.tl{display:flex;flex-direction:column;align-items:center;gap:.25em;background:none;border:0;padding:.15em 0;font:600 .74em/1.15 Poppins,system-ui,sans-serif;color:#222;text-align:center;cursor:pointer}
.tl i{width:4.1em;height:4.1em;border-radius:50%;background:#DDF2E8;display:grid;place-items:center;font-style:normal;position:relative;outline-offset:2px}
.tl .em{font-size:2em}.tl svg{width:64%;height:64%}
.tlg{font-style:italic;font-weight:800;color:#1E6CC8}
.bd{position:absolute;top:-.2em;right:-.6em;background:#F0524B;color:#fff;font:700 .72em system-ui;border-radius:.9em;padding:.1em .5em}
.sos{background:#E53935;color:#fff;border-radius:50%;width:84%;height:84%;display:grid;place-items:center;font-size:.9em;border:.2em solid #fff;box-shadow:0 0 0 .15em #E53935}
.pr{margin:.5em .2em;padding:.7em;border-radius:.9em;background:linear-gradient(#EAF6F0,#fff);box-shadow:0 .1em .7em rgba(0,0,0,.12);font-size:.75em;line-height:1.4}
.pr h6{margin:0 0 .3em;color:#1E8A4C;font-size:1.2em;font-weight:800}
.nv2{display:flex;justify-content:space-around;align-items:flex-end;background:#fff;padding:.35em 0 .45em;box-shadow:0 -.1em .6em rgba(0,0,0,.1);flex:none}
.nb{display:flex;flex-direction:column;align-items:center;gap:.15em;background:none;border:0;font:600 .72em Poppins,system-ui,sans-serif;color:#9aa3ad;cursor:pointer;min-width:4em}
.nb svg{width:2em;height:2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:#1B8FD6}
.nb.mid i{width:3.8em;height:3.8em;border-radius:50%;margin-top:-1.9em;background:linear-gradient(#32C2EF,#1E6CC8);color:#fff;display:grid;place-items:center;box-shadow:0 .2em .7em rgba(30,108,200,.5);outline-offset:2px}
.nb.mid{color:#1B8FD6}
#pg{position:absolute;inset:0;background:#F6F7FA;display:none;flex-direction:column;color:#1b2a3a}
.pgh{display:flex;align-items:center;justify-content:space-between;padding:1.1em .8em .9em;color:#fff;font-weight:700;font-size:1.05em;flex:none}
#pgBack{background:none;border:0;color:#fff;font-size:1.7em;line-height:1;cursor:pointer;width:1.5em}
#pgB{flex:1;overflow:auto;padding:.7em;font-size:1em;scrollbar-width:none}
.rc{background:#fff;border-radius:.9em;box-shadow:0 .1em .7em rgba(0,0,0,.1);padding:.3em .7em}
.rw{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #edf0f4;padding:.5em 0;cursor:pointer;outline-offset:2px}
.rw small{display:block;color:#2B8FCF;font-size:.8em;font-weight:600}.rw b{display:block;color:#5B3E96;font-size:.9em;font-weight:600}.rw em{display:block;color:#2B8FCF;font-size:.75em}.rw span{color:#888;font-size:1.3em}
.kis{background:#fff;border-radius:.9em;overflow:hidden;box-shadow:0 .1em .7em rgba(0,0,0,.14);text-align:left}
.kh{background:linear-gradient(90deg,#1E8E6E,#2CA58A);color:#fff;padding:.5em .8em;display:flex;align-items:center;gap:.6em;font-weight:700;font-size:1em}
.kb{padding:.6em .8em;position:relative;font-size:.78em;color:#222}.kb td{padding:.1em .3em .1em 0;vertical-align:top}
.qr{position:absolute;right:.7em;bottom:.5em;width:3em;height:3em;border-radius:.5em;background:#1E6CC8;color:#fff;display:grid;place-items:center;font-size:1.6em}
.kc{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;outline-offset:2px;border-radius:.9em}
.fl{color:#2B8FCF;font-weight:700;margin:.7em 0 .25em;font-size:.95em}
.fd{display:flex;justify-content:space-between;align-items:center;gap:.5em;width:100%;text-align:left;border:.1em solid #2B8FCF;border-radius:.6em;padding:.6em .7em;background:#fff;font:500 .85em Poppins,system-ui,sans-serif;color:#333;cursor:pointer;outline-offset:2px}
.fo .rd{width:1.1em;height:1.1em;border-radius:50%;border:.14em solid #2B8FCF;flex:none}
.fo.on{background:#E3F2FD}.fo.on .rd{background:#2B8FCF;box-shadow:inset 0 0 0 .2em #E3F2FD}
.pl{display:inline-block;background:#DDF2E8;color:#1E7A4C;font-size:.85em;font-weight:600;border-radius:1em;padding:.25em .9em}
.tc{display:flex;width:100%;border:0;text-align:left;border-radius:1em;background:#fff;box-shadow:0 .1em .8em rgba(0,0,0,.12);overflow:hidden;cursor:pointer;outline-offset:2px}
.tcl{width:4.4em;flex:none;display:grid;place-items:center;font-size:2em}
.tcr{padding:.6em;font-size:.9em}.tcr small{display:inline-block;font-size:.7em;font-weight:800;background:#E3F5E8;color:#1E7A4C;border-radius:.6em;padding:.1em .6em}.tcr b{display:block;margin:.2em 0;font-size:1em}.tcr p{margin:0 0 .3em;font-size:.78em;color:#667;line-height:1.3}.tcr u{text-decoration:none;color:#1E7A4C;font-weight:700;font-size:.82em}
.dc{display:flex;width:100%;border:0;text-align:left;margin-bottom:.6em;border-radius:.8em;overflow:hidden;background:#fff;box-shadow:0 .1em .7em rgba(0,0,0,.15);cursor:pointer;outline-offset:2px}
.dl{width:3.8em;flex:none;background:linear-gradient(#A94FD0,#2E7BD1);display:grid;place-items:center}
.dl i{width:2.4em;height:2.4em;border-radius:50%;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:.9em}
.dr{padding:.6em;flex:1;font-size:.9em}.dr b{display:block;font-size:1em}.dr span{display:block;font-size:.82em}
.dr em{float:right;font-style:normal;background:#9aa0a6;color:#fff;border-radius:.4em;padding:.2em .7em;font-weight:700;font-size:.82em}
.ic{background:#fff;border-radius:.8em;border-left:.4em solid #8E5BD0;box-shadow:0 .1em .7em rgba(0,0,0,.14);padding:.7em .9em;font-size:.95em}
.ic div{display:flex;justify-content:space-between;margin-top:.3em}
.it{font-style:italic;margin:2em .2em 0;color:#333;font-size:.9em}
.tot{background:#fff;padding:.8em;margin:.8em -.7em -1em;display:flex;justify-content:space-between;font-weight:500}
#shd{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none}
.sheet2{width:100%;background:#fff;border-radius:1.4em 1.4em 0 0;padding:1em 1em 1.3em;align-self:flex-end}
.sheet2 h4{margin:0 0 .3em;text-align:center;color:#1B8FD6;font-weight:700;font-size:1em}
.sopt{display:flex;align-items:center;gap:.8em;width:100%;background:#fff;border:0;border-radius:1em;box-shadow:0 .1em .7em rgba(0,0,0,.15);padding:.8em;margin-top:.7em;font:700 .9em Poppins,system-ui,sans-serif;text-align:left;cursor:pointer;outline-offset:2px}
.sopt i{font-style:normal;font-size:1.6em}.sopt b{flex:1}.sopt span{color:#888;font-size:1.3em}
.dlg{width:90%;margin:auto;background:#fff;border-radius:1em;padding:1em;position:relative;max-height:94%;overflow:auto;scrollbar-width:none}
.dlg h4{text-align:center;margin:0 0 .6em;font-size:1.05em}
.dlg .x{position:absolute;top:.5em;right:.5em;width:1.8em;height:1.8em;border-radius:50%;background:#E5483B;color:#fff;display:grid;place-items:center;font-weight:700}
.dlg .nt{margin:.5em 0;color:#445;font-size:.85em}

/* papan peringkat */
#sLead{background:var(--bg);pointer-events:auto;overflow-y:auto}
.lb-head{position:relative;background:var(--blue);color:#fff;text-align:center;border-radius:0 0 32px 32px;padding:max(24px,env(safe-area-inset-top)) 20px 68px;flex:none}
.lb-head h2{margin:0;font-size:26px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:10px}
.lb-head h2 .ico{width:28px;height:28px}
#myRes{font-size:13.5px;margin-top:8px;font-weight:700;color:#D6EAF8}
#upd{font-size:12px;margin-top:4px;color:#A9CDE9;font-weight:600}
#btnRef{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;color:var(--blue);font:800 13px "Baloo 2",Nunito,sans-serif;padding:8px 14px;cursor:pointer}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 16px;margin-top:-46px;flex:none}
.pod>div{flex:1;text-align:center;min-width:0}
.pod .blk{border-radius:16px 16px 0 0;color:#fff;font:800 26px "Baloo 2",Nunito,sans-serif;display:flex;align-items:center;justify-content:center}
.pod .nm{background:#fff;border-radius:16px;padding:9px 6px;margin:0 0 6px;box-shadow:0 6px 18px rgba(18,50,79,.12)}
.pod .nm.me{outline:3px solid var(--green)}
.pod .nm b{display:block;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .nm span{font-size:12.5px;font-weight:800;color:var(--green)}
.crown{height:34px;color:var(--green);display:grid;place-items:end center}
.crown .ico{width:30px;height:30px;fill:currentColor}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 16px 10px;border-radius:18px;flex:none}
.row.me{outline:3px solid var(--green)}
.row .rk{width:30px;height:30px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;font:800 14px "Baloo 2",Nunito,sans-serif;flex:none}
.row .nmr{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{font-size:12px;color:var(--mut);font-weight:700}
.row .sc{color:var(--green);min-width:56px;text-align:right}
/* ikon & detail HP */
#phoneUI{border-radius:2.6em}
#phoneUI .isl{position:absolute;top:.6em;left:50%;transform:translateX(-50%);width:5.6em;height:1.6em;border-radius:1em;background:#000;z-index:30;pointer-events:none}
#phoneUI .hind{position:absolute;bottom:.35em;left:50%;transform:translateX(-50%);width:6.2em;height:.28em;border-radius:.2em;background:#0b1620;opacity:.8;z-index:30;pointer-events:none}
.sbar{font-size:.72em;font-weight:700;align-items:center;margin:.3em .6em .8em;height:1.6em}
.stt{display:flex;gap:.4em;align-items:center}.sg{width:1.4em;height:.9em;fill:currentColor}.bt{width:2em;height:.95em;fill:currentColor}
.sbx .ico{width:1.4em;height:1.4em;color:#556}
.bl{display:grid;place-items:center;color:#fff;flex:none}.bl .ico{width:1.7em;height:1.7em}
.av .ico{width:1.5em;height:1.5em;color:#1E6CC8}
.okc{display:inline-grid;place-items:center;width:1.1em;height:1.1em;border-radius:50%;background:#2EAD5B;color:#fff;vertical-align:-.15em}.okc .ico{width:.75em;height:.75em;stroke-width:3}
.tl svg.gl{width:56%;height:56%;stroke:#0B5E8A;stroke-width:1.7;fill:none}
.aq .bg .ico{width:60%;height:60%;stroke:#fff;stroke-width:1.8}
.kh .ico{width:1.4em;height:1.4em}
.qr{background:#fff!important;border:.12em solid #1E6CC8;color:#12324F;overflow:hidden}
.qr svg{width:100%;height:100%;padding:.12em;box-sizing:border-box}
.gl2{width:1.7em;height:1.7em;stroke:#0B5E8A;stroke-width:1.7}
.tcl .gl2{width:2.2em;height:2.2em;stroke:#1E7A4C}
.dr em .ico{width:1.1em;height:1.1em;vertical-align:-.2em}
#pgBack .ico{width:1.3em;height:1.3em;stroke-width:2.6}
#pgBack{display:grid;place-items:center}
.btn2 .ico{width:1.2em;height:1.2em;vertical-align:-.22em}
.cb{display:inline-block;width:1em;height:1em;border:.14em solid #2B8FCF;border-radius:.25em;margin-right:.5em;vertical-align:-.15em;box-sizing:border-box}
.dlg .x .ico{width:1em;height:1em;stroke-width:3}
/* spacing HP */
.jkn .top{padding:.5em 1em 1em}
.gr{padding:.7em 1em .3em}
.hbody{padding:0 .7em .8em}
.aq{margin:.6em .2em .8em;padding:.8em;gap:.8em}
.tg{gap:.5em .15em}
.tl{padding:.25em .1em;gap:.35em}
.tl i{width:3.9em;height:3.9em}
.pr{margin:.8em .2em}
.nv2{padding:.5em .6em 1em}
#pgB{padding:1em 1em 1.8em}
.pgh{padding:1.5em 1em 1em}
.rc{padding:.5em .9em}
.rw{padding:.7em 0}
.fl{margin:1em 0 .4em}
.fd{padding:.75em .9em}
.fo{margin-top:.5em}
.kb{padding:.8em 1em}
.tc{margin-bottom:.2em}
.tcr{padding:.8em}
.dc{margin-bottom:.8em}
.dr{padding:.8em}
.dl{width:4.2em}
.ic{padding:.9em 1.1em}
.sheet2{padding:1.2em 1.2em 2em}
.sopt{padding:1em;margin-top:.8em}
.dlg{padding:1.3em;width:88%}
.dlg .x{top:.7em;right:.7em}
.btn2.full{margin-top:1.2em}

/* perbaikan papan peringkat */
#sLead{scrollbar-width:none}#sLead::-webkit-scrollbar{display:none}
.lb-head{padding:max(18px,env(safe-area-inset-top)) 20px 30px}
.lb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lb-tag{font:800 13px "Baloo 2",Nunito,sans-serif;color:#D6EAF8;letter-spacing:.6px;text-transform:uppercase}
#btnRef{position:static}
.pod{position:relative;z-index:1;margin-top:24px}
.sec{margin:24px 20px 10px;font:800 14px "Baloo 2",Nunito,sans-serif;color:var(--mut)}
.lb-foot{margin-top:auto;padding-top:16px}

</head>
<body>
<div id="app">
  <div id="hud"><div class="chip"><span class="dots" id="hDots"></span><span id="hTxt"></span></div><div style="display:flex;gap:8px;align-items:center"><div class="chip"><i data-i="star" class="sti"></i><b id="hVal">0</b></div><button id="btnMute" aria-label="Suara"><i data-i="sound"></i></button></div></div>
  <div id="cap"></div><div id="toast"></div>

  <section id="sStart" class="scr">
    <div class="st-head">
      <div class="st-logo"><img id="imgJkn" alt="Mobile JKN"></div>
      <h1>Simulasi Mobile JKN</h1>
      <p>Kenali fitur Mobile JKN lewat 5 misi di dunia 3D.</p>
      <div class="chips"><span><i data-i="ticket"></i>5 skenario</span><span><i data-i="check"></i>3 langkah</span><span><i data-i="clock"></i>45 detik</span></div>
    </div>
    <div class="card st-card">
      <label for="inName">Masukkan Nama Anda</label>
      <input id="inName" maxlength="18" autocomplete="off" placeholder="Contoh: Dewi">
      <div id="nameErr" role="alert" style="display:none;color:#DC2626;font-size:12.5px;font-weight:700;margin:0 0 6px"></div><div style="height:10px"></div>
      <button class="btn" id="btnStart">Mulai Simulasi</button>
      <button class="btn ghost" id="btnBoard"><i data-i="trophy"></i>Lihat Papan Peringkat</button>
    </div>
  </section>

  <section id="sIntro" class="scr" style="justify-content:flex-end">
    <div class="card sheet pe">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="who" id="inWho"></span>
        <button id="btnVo" class="mini"><i data-i="replay"></i>Ulangi Adegan</button>
      </div>
      <p id="sub"></p>
      <button class="btn" id="btnOpen" style="display:none">Buka Mobile JKN<i data-i="arrow"></i></button>
    </div>
  </section>

  <section id="sGame" class="scr">
    <div id="timerBox" class="card pe">
      <div class="trow">
        <div style="display:flex;align-items:center;gap:8px"><i data-i="clock" class="tci"></i><b id="tTxt">45</b><small>dtk</small></div>
        <span id="mission"></span>
      </div>
      <div class="bar"><div id="tBar"></div></div>
    </div>
    <div id="phoneUI"><div class="jkn" id="home"></div><div id="pg"><div class="pgh au"><button id="pgBack" aria-label="Kembali"><i data-i="chevL"></i></button><b id="pgT"></b><span style="width:1.5em"></span></div><div id="pgB"></div></div><div id="shd"></div><div class="isl"></div><div class="hind"></div></div>
  </section>

  <section id="sWin" class="scr" style="justify-content:flex-end">
    <div class="card sheet pe" id="winCard">
      <div class="win-h"><span class="win-ok"><i data-i="check"></i></span><b>Misi selesai</b></div>
      <h2 id="winTitle"></h2>
      <p id="winEdu"></p>
      <div class="note" id="winPts"></div>
      <button class="btn" id="btnNext">Lanjut</button>
    </div>
  </section>

  <section id="sLead" class="scr">
    <div class="lb-head">
      <div class="lb-top"><span class="lb-tag">Dashboard</span><button id="btnRef"><i data-i="refresh"></i>Refresh</button></div>
      <h2><i data-i="trophy"></i>Papan Peringkat</h2>
      <div id="myRes"></div>
      <div id="upd"></div>
    </div>
    <div class="pod" id="podium"></div>
    <div id="rest"></div>
    <div class="lb-foot"><div id="src" style="text-align:center;font-size:12px;color:#94a3b8;margin:0 0 12px;font-weight:600"></div><div style="padding:0 16px max(20px,env(safe-area-inset-bottom))"><button class="btn" id="btnAgain">Main Lagi</button></div></div>
  </section>
</div>

const KEY='mjkn_leaderboard_v2';
const DUMMY=[{id:'d1',nama:'Rina',totalSkor:12500,sisaWaktuTotal:100},{id:'d2',nama:'Dimas',totalSkor:10300,sisaWaktuTotal:78},{id:'d3',nama:'Sari',totalSkor:8100,sisaWaktuTotal:56},{id:'d4',nama:'Agus',totalSkor:6200,sisaWaktuTotal:37}];
const cmp=(a,b)=>(b.totalSkor-a.totalSkor)||(b.sisaWaktuTotal-a.sisaWaktuTotal);
let useApi=false;
function loadLB(){try{const r=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(r)&&r.length)return r.sort(cmp)}catch(e){}return DUMMY.slice()}
function saveLB(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
async function initDB(){
  const m=new URLSearchParams(location.search).get('mode')||CFG.mode;
  if(m==='dummy'){useApi=false;return}
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),1500);const r=await fetch(CFG.apiBase+'/api/health',{signal:c.signal});clearTimeout(to);useApi=r.ok}catch(e){useApi=false}
}
async function postScore(e){
  if(useApi){try{const r=await fetch(CFG.apiBase+'/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});if(r.ok)return String((await r.json()).id)}catch(x){}useApi=false}
  const lb=loadLB();e.id='p'+Date.now();lb.push(e);lb.sort(cmp);saveLB(lb.slice(0,50));return e.id;
}
async function getLB(){
  if(useApi){try{const r=await fetch(CFG.apiBase+'/api/leaderboard');if(r.ok)return await r.json()}catch(x){}useApi=false}
  return loadLB();
}

function rr(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);return s}
function slab(w,h,r,d,bv,c){const g=new THREE.ExtrudeGeometry(rr(w,h,r),{depth:d,bevelEnabled:true,bevelThickness:bv,bevelSize:bv,bevelSegments:2,curveSegments:8});g.translate(0,0,-d/2);return mesh(g,c)}
function buildPhone(W,H,D){
  while(phoneBody.children.length){const c=phoneBody.children.pop();if(c.geometry)c.geometry.dispose()}
  const bv=W*.01,r=W*.16,fw=W*.018;
  phoneBody.add(slab(W-2*bv,H-2*bv,r,D-2*bv,bv,'#8E8982'));
  const gl=mesh(new THREE.ShapeGeometry(rr(W-2*fw,H-2*fw,r-fw),10),'#030303');gl.position.z=D/2+.001;phoneBody.add(gl);
  const bk=mesh(new THREE.ShapeGeometry(rr(W-2*fw,H-2*fw,r-fw),10),'#77726C');bk.rotation.y=Math.PI;bk.position.z=-D/2-.001;phoneBody.add(bk);
  const mw=W*.44,mod=new THREE.Group();mod.position.set(W/2-fw-mw/2-W*.04,H/2-fw-mw/2-W*.04,-D/2-D*.08);
  const pl=slab(mw,mw,mw*.22,D*.16,mw*.015,'#9B968D');mod.add(pl);
  [[.22,.22],[.22,-.22],[-.2,0]].forEach(([x,y])=>{const a=cyl(mw*.2,mw*.2,D*.12,'#2A2A2C',x*mw,y*mw,-D*.1,14),b=cyl(mw*.15,mw*.15,D*.14,'#08080C',x*mw,y*mw,-D*.11,14);a.rotation.x=b.rotation.x=Math.PI/2;mod.add(a,b)});
  const fl=cyl(mw*.06,mw*.06,D*.12,'#F3EDE0',-.2*mw,.3*mw,-D*.1,10);fl.rotation.x=Math.PI/2;mod.add(fl);phoneBody.add(mod);
  [[-1,.28,.035],[-1,.2,.06],[-1,.1,.06],[1,.2,.1],[1,-.15,.06]].forEach(([s,y,hh])=>phoneBody.add(box(W*.016,H*hh,D*.3,'#6F6B65',s*(W/2),H*y,0)));
}

  iuran:()=>`<div class="ic"><b>${esc(NM())}</b><div style="display:block">0001234567890</div><div><span>Sisa Saldo</span><span>-</span></div><hr style="margin:.5em 0;border-color:#1E8E6E"><div><span>${SVG('card')} Tagihan</span><span>-</span></div></div><p class="it">Batas waktu pembayaran tagihan iuran adalah tanggal 10 setiap bulan berjalan.</p><div class="tot"><span>Total Tagihan</span><span>-</span></div>`,
  form:st=>`<div class="fl" style="margin-top:0">Peserta</div><div class="fd"><span>${esc(NM())} (0001234567890)</span><span>▾</span></div><div class="fl">Faskes Tingkat Pertama</div><div class="fd" style="display:block;text-align:center;line-height:1.6"><b>PUSKESMAS SEHAT</b><div style="font-size:.8em;text-align:left;border-top:1px solid #ddd;margin-top:.4em;padding-top:.4em">Alamat JL. RAYA NO 200<br>Telepon 0327-511046</div></div>${grp(st)}<div class="fl">Keluhan</div><div class="fd" style="height:3.6em;color:#999;align-items:flex-start">Silakan isi keluhan . . .</div><button class="save btn2 full">Simpan</button>`
};
const sheetHtml=s=>`<div class="sheet2"><h4>${esc(s.t)}</h4>${s.o.map((o,i)=>`<button class="op sopt" data-i="${i}">${o.ic?`<i>${SVG(o.ic,'gl2')}</i>`:''}<b>${esc(o.t||o)}</b><span>›</span></button>`).join('')}</div>`;
const dlgHtml=st=>`<div class="dlg"><div class="x">${SVG('close')}</div><h4>${esc(st.dialog)}</h4><div style="color:#2B8FCF;font-weight:600"><span class="cb"></span>Perubahan Satu Keluarga</div><p class="nt">Perubahan Fasilitas Kesehatan dapat dilakukan minimal 3 Bulan sekali.</p><div class="fl">Provinsi</div><div class="fd"><span>Jawa Timur</span><span>▾</span></div><div class="fl">Kota / Kabupaten</div><div class="fd"><span>Kota Baru</span><span>▾</span></div>${grp(st)}<button class="save btn2 full">Simpan</button></div>`;

/* ===== STATE MACHINE ===== */
let cur=0,step=0,total=0,remTotal=0,name='Peserta',locked=true,timerId=0,endAt=0,lastPts=0,lastSisa=0,myId='',tlA=null,sel={},lastTick=99;
function showStart(){
  cur=1;stopVO();if(tlA){tlA.kill();tlA=null}confetti.visible=false;phone.visible=false;gsap.set('#phoneUI',{opacity:0});
  const sn=SC[1].sc;setScene(1);sn.reset();sn.actors[0].userData.m=WV;scene.background=sky(...sn.bg);
  Object.assign(cam,{x:0,y:3.0,z:12.5,lx:0,ly:1.2,amp:1.6});show('sStart');
}
async function openBoard(){
  stopVO();myId='';show('sLead');$('#btnAgain').textContent='Mulai Main';$('#myRes').textContent='Memuat…';$('#podium').innerHTML='';$('#rest').innerHTML='';
  if(!useApi)await initDB();renderLB(await getLB());
}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('#hud').style.display=['sIntro','sGame','sWin'].includes(id)?'flex':'none'}
function hudUpdate(){ID('hDots').innerHTML=SC.map((s,i)=>`<i class="${i<cur?'on':i===cur?'cur':''}"></i>`).join('');ID('hTxt').textContent=(cur+1)+'/'+SC.length;ID('hVal').textContent=total}
function toast(t){const e=$('#toast');e.textContent=t;gsap.killTweensOf(e);gsap.fromTo(e,{opacity:0,y:-10},{opacity:1,y:0,duration:.2});gsap.to(e,{opacity:0,delay:1.6,duration:.3})}
/* ===== VOICE OVER: file audio rekaman di folder audio/ (tanpa text-to-speech) ===== */
const AUD={};let curVO=null,chainId=0,introTok=0;
const vo=k=>AUD[k]||(()=>{const a=new Audio('audio/'+k+'.mp3');a.preload='auto';a.addEventListener('error',()=>{a.dead=1});return AUD[k]=a})();
function probe(k){return new Promise(res=>{const a=vo(k),fin=()=>res(a.dead||!isFinite(a.duration)?0:a.duration);if(a.dead)return res(0);if(a.readyState>=1)return fin();a.addEventListener('loadedmetadata',fin,{once:true});a.addEventListener('error',()=>res(0),{once:true});setTimeout(()=>res(a.readyState>=1&&isFinite(a.duration)?a.duration:0),2000)})}
function stopVO(){chainId++;if(curVO){try{curVO.pause()}catch(e){}curVO=null}}
function playVO(k,after){stopVO();const my=chainId;if(!sfxOn)return;const a=vo(k);if(a.dead){if(after)after();return}try{a.currentTime=0;curVO=a;a.onended=()=>{if(my===chainId&&after)after()};const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function say(t,key){$('#sub').textContent=t;gsap.fromTo('#sub',{opacity:0},{opacity:1,duration:.3});playVO(key)}
function setScene(i){SC.forEach((s,k)=>s.sc.g.visible=k===i);clouds.visible=!!SC[i].sc.out}
function camTo(tl,shot,t){tl.to(cam,{...shot,amp:.5,duration:1.2,ease:'power2.inOut'},t)}

async function goIntro(){
  const tok=++introTok,n=cur+1;
  if(tlA)tlA.kill();stopVO();
  const sc=SC[cur],sn=sc.sc;
  confetti.visible=false;phone.visible=false;gsap.set('#phoneUI',{opacity:0});$('#cap').style.display='none';
  ['btnOpen','btnVo'].forEach(i=>{const b=ID(i);gsap.killTweensOf(b);b.style.display='none'});
  setScene(cur);sn.reset();scene.background=sky(...sn.bg);Object.assign(cam,{...sn.shots[0],amp:.5});
  hudUpdate();show('sIntro');$('#inWho').textContent='Skenario '+n+': '+sc.who;$('#sub').textContent='';
  const durs=await Promise.all(sc.lines.map((_,i)=>probe('s'+n+'_b'+(i+1))));
  if(tok!==introTok)return;
  const tl=tlA=gsap.timeline({onComplete:()=>{['btnVo','btnOpen'].forEach(i=>{const b=ID(i);b.style.display=i==='btnVo'?'inline-flex':'flex';gsap.fromTo(b,{opacity:0,y:10},{opacity:1,y:0,duration:.35})});sfx('pop')}});
  let t=.3;
  sc.lines.forEach((ln,i)=>{const d=durs[i]>0?Math.max(2,durs[i]+.6):1.9+ln.length*.055;tl.call(()=>say(ln,'s'+n+'_b'+(i+1)),null,t);camTo(tl,sn.shots[i],t);sn.acts[i](tl,t,d);t+=d});
  tl.to({},{duration:.6});
}
const missionTxt=()=>{$('#mission').textContent='Misi: '+SC[cur].mission+' • Langkah '+(step+1)+'/3'};
function openPhone(){
  if(tlA){tlA.kill();tlA=null}
  stopVO();
  show('sGame');locked=true;step=0;ID('pg').style.display='none';ID('shd').style.display='none';
  ID('home').querySelector('.hbody').scrollTop=0;lastTick=99;
  $('#tTxt').textContent=''+TL;$('#tTxt').style.color='';$('#tBar').style.width='100%';$('#tBar').style.background='';
  missionTxt();scene.background=NEUTRAL;
  gsap.to(cam,{...PH,duration:.7,ease:'power2.inOut',onComplete:()=>{
    SC[cur].sc.g.visible=false;clouds.visible=false;phone.visible=true;
    phone.scale.setScalar(.2);phone.rotation.set(0,Math.PI,0);sfx('pop');
    gsap.to(phone.scale,{x:1,y:1,z:1,duration:.9,ease:'back.out(1.4)'});
    gsap.to(phone.rotation,{y:0,duration:.9,ease:'power2.out',onComplete:()=>{
      gsap.fromTo('#phoneUI',{opacity:0,scale:.85},{opacity:1,scale:1,duration:.35});
      locked=false;endAt=performance.now()+TL*1000;clearInterval(timerId);timerId=setInterval(tick,100);
    }});
  }});
}
function tick(){
  const rem=(endAt-performance.now())/1000;
  if(rem<=0){timeout();return}
  const c=Math.ceil(rem);
  if(c<=5&&c!==lastTick){sfx('tick')}lastTick=c;
  $('#tTxt').textContent=''+c;$('#tTxt').style.color=rem<=10?'#DC2626':'';
  $('#tBar').style.width=(rem/TL*100)+'%';$('#tBar').style.background=rem<=10?'#DC2626':'';
}
function shake(){
  gsap.killTweensOf('#phoneUI');gsap.killTweensOf(phone.position);gsap.set('#phoneUI',{x:0});phone.position.x=0;
  gsap.to('#phoneUI',{x:12,duration:.05,repeat:9,yoyo:true,ease:'none',onComplete:()=>gsap.set('#phoneUI',{x:0})});
  gsap.to(phone.position,{x:.15,duration:.05,repeat:9,yoyo:true,ease:'none',onComplete:()=>{phone.position.x=0}});
}
function mark(el,col){el.style.outline='3px solid '+col;return el}
function wrong(el){endAt-=5000;shake();sfx('bad');playVO('ui_salah');toast('Ups, salah menu! Waktu -5 detik');mark(el,'#DC2626');setTimeout(()=>{el.style.outline=''},550);tick()}

function renderStep(){
  const pg=ID('pg'),sh=ID('shd');sel={};missionTxt();
  if(step===0){pg.style.display='none';sh.style.display='none';return}
  const st=SC[cur].steps[step-1];
  if(st.page){pg.style.display='flex';ID('pgT').textContent=st.t;ID('pgB').innerHTML=PAGES[st.page](st);ID('pgB').scrollTop=0;gsap.fromTo(pg,{x:30,opacity:.3},{x:0,opacity:1,duration:.22})}
  else pg.style.display='none';
  if(st.sheet||st.dialog){sh.style.display='flex';sh.innerHTML=st.sheet?sheetHtml(st.sheet):dlgHtml(st);gsap.from(sh.firstChild,{y:40,opacity:0,duration:.25})}
  else sh.style.display='none';
}
function advance(){locked=true;if(step<2){step++;setTimeout(()=>{renderStep();locked=false},320)}else complete()}
function back(){if(locked)return;if(step===2){step=1;renderStep()}else if(step===1){step=0;renderStep()}}
ID('pgBack').onclick=back;
ID('phoneUI').addEventListener('click',e=>{
  if(locked)return;
  if(e.target.id==='shd'){back();return}
  const hm=e.target.closest('.hm'),op=e.target.closest('.op'),sv=e.target.closest('.save');
  if(step===0){
    if(!hm)return;const id=hm.dataset.id;if(id==='home')return;
    const el=hm.querySelector('i')||hm;
    if(id===SC[cur].k1){mark(el,'#00A651');sfx('ok');locked=true;step=1;setTimeout(()=>{renderStep();locked=false},320)}else wrong(el);
    return;
  }
  const st=SC[cur].steps[step-1];
  if(sv&&st.groups){
    if(st.groups.some((g,gi)=>sel[gi]==null)){toast('Lengkapi pilihan dulu');return}
    const bad=st.groups.map((g,gi)=>sel[gi]!==g.a?gi:-1).filter(x=>x>=0);
    if(bad.length){bad.forEach(gi=>{const o=document.querySelector('.fo[data-g="'+gi+'"].on');if(o){mark(o,'#DC2626');setTimeout(()=>{o.style.outline=''},550)}});wrong(sv)}
    else{mark(sv,'#00A651');sfx('ok');advance()}
    return;
  }
  if(!op)return;
  if(st.groups){const g=+op.dataset.g;sel[g]=+op.dataset.i;document.querySelectorAll('.fo[data-g="'+g+'"]').forEach(x=>x.classList.toggle('on',x===op));sfx('click');return}
  const a=(st.sheet&&op.closest('#shd'))?st.sheet.a:st.a;
  if(+op.dataset.i===a){mark(op,'#00A651');sfx('ok');advance()}else wrong(op);
});

function complete(){
  clearInterval(timerId);
  lastSisa=Math.floor(Math.max(0,(endAt-performance.now())/1000));lastPts=lastSisa*100+500;total+=lastPts;remTotal+=lastSisa;
  setTimeout(goWin,700);
}
function timeout(){
  if(locked&&step<0)return;locked=true;clearInterval(timerId);sfx('fail');playVO('ui_habis');
  $('#tTxt').textContent='0';$('#tBar').style.width='0%';lastPts=0;lastSisa=0;toast('Waktu habis! Lihat penjelasan di bawah');
  setTimeout(goWin,1300);
}
async function goWin(){
  const sc=SC[cur],sn=sc.sc;
  gsap.to('#phoneUI',{opacity:0,duration:.25});gsap.to(phone.scale,{x:.2,y:.2,z:.2,duration:.5});
  gsap.to(phone.rotation,{y:-Math.PI,duration:.5,onComplete:()=>{phone.visible=false}});
  setScene(cur);scene.background=sky(...sn.bg);if(cur===3)scene.background=sky('#0F1B3D','#2B3A67');
  hudUpdate();show('sWin');$('#winCard').style.display='none';$('#cap').style.display='block';
  const wd=await Promise.all([1,2].map(i=>probe('s'+(cur+1)+'_w'+i)));
  const tl=tlA=gsap.timeline();let t=.3;
  if(lastPts>0)tl.call(()=>sfx('win'),null,.2);
  sn.wacts.forEach((f,i)=>{const d=Math.max(2.6,(wd[i]||0)+.7);camTo(tl,sn.wshots[i],t);tl.call(()=>{$('#cap').textContent=sn.wcap[i];playVO('s'+(cur+1)+'_w'+(i+1));gsap.fromTo('#cap',{opacity:0},{opacity:1,duration:.3});if(i===1&&lastPts>0){confetti.visible=true;sfx('cheer')}},null,t);f(tl,t,d);t+=d});
  tl.call(()=>{
    $('#cap').style.display='none';
    $('#winTitle').textContent='Menu: '+sc.menu;$('#winEdu').textContent=sc.edu;
    $('#winPts').textContent=lastPts>0?'+'+lastPts+' poin  (sisa '+lastSisa+' dtk × 100 + 500)':'Waktu habis: 0 poin untuk skenario ini';
    $('#btnNext').textContent=cur<SC.length-1?'Lanjut':'Lihat Peringkat';
    $('#winCard').style.display='block';gsap.from('#winCard',{y:80,opacity:0,duration:.4,ease:'back.out(1.2)'});if(lastPts>0){sfx('coin');playVO('ui_selesai',()=>playVO('edu_'+(cur+1)))}else playVO('edu_'+(cur+1));
  },null,t);
}
function nextStep(){stopVO();if(tlA){tlA.kill();tlA=null}if(cur<SC.length-1){cur++;goIntro()}else finish()}
async function finish(){
  confetti.visible=false;show('sLead');$('#btnAgain').textContent='Main Lagi';$('#myRes').textContent='Menyimpan skor…';$('#podium').innerHTML='';$('#rest').innerHTML='';
  myId=String(await postScore({nama:name,totalSkor:total,sisaWaktuTotal:remTotal}));
  renderLB(await getLB());playVO('ui_juara');
}
async function refreshLB(){
  const b=ID('btnRef');b.disabled=true;b.innerHTML=SVG('refresh')+'Memuat…';
  if(!useApi)await initDB();
  renderLB(await getLB());b.disabled=false;b.innerHTML=SVG('refresh')+'Refresh';
}
function renderLB(lb){
  lb=lb.slice().sort(cmp);let rank=0;
  if(myId){rank=lb.findIndex(x=>String(x.id)===myId)+1;if(!rank){lb=lb.concat({id:myId,nama:name,totalSkor:total,sisaWaktuTotal:remTotal});lb.sort(cmp);rank=lb.findIndex(x=>String(x.id)===myId)+1}}
  $('#myRes').textContent=myId?('Skor kamu '+total+'  •  Sisa waktu '+remTotal+' dtk  •  Peringkat #'+rank):'Pemain terbaik simulasi Mobile JKN';
  $('#upd').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID');
  $('#src').textContent=useApi?'Sumber data: PostgreSQL':'Sumber data: lokal (dummy, localStorage)';
  const cfg=[{i:0,bg:'#00A651',h:120},{i:1,bg:'#0072BC',h:90},{i:2,bg:'#4C8DBE',h:68}];
  $('#podium').innerHTML=[cfg[1],cfg[0],cfg[2]].map(c=>{const p=lb[c.i];if(!p)return'<div></div>';
    return `<div><div class="crown">${c.i===0?SVG('crown'):''}</div><div class="nm${String(p.id)===myId?' me':''}"><b>${esc(p.nama)}</b><span>${p.totalSkor}</span></div><div class="blk" style="height:${c.h}px;background:${c.bg}">${c.i+1}</div></div>`}).join('');
  const row=(p,r)=>`<div class="card row${String(p.id)===myId?' me':''}"><span class="rk">${r}</span><span class="nmr">${esc(p.nama)}</span><span class="tm">${p.sisaWaktuTotal} dtk</span><b class="sc">${p.totalSkor}</b></div>`;
  let h=lb.slice(3,8).map((p,i)=>row(p,i+4)).join('');if(h)h='<div class="sec">Peringkat lainnya</div>'+h;
  if(rank>8)h+='<div style="text-align:center;color:#94a3b8;margin-bottom:6px">...</div>'+row(lb[rank-1],rank);
  $('#rest').innerHTML=lb.length?h:'<div style="text-align:center;color:#64748b;padding:28px 20px;font-weight:700">Belum ada skor. Jadilah yang pertama!</div>';
}

/* validasi nama + mulai */
function begin(){
  const inp=$('#inName'),err=$('#nameErr'),v=inp.value.trim();
  let m='';
  if(!v)m='Nama wajib diisi sebelum mulai.';
  else if(v.length<2)m='Nama minimal 2 karakter.';
  else if(!/^[\p{L}][\p{L}\s.'-]*$/u.test(v))m='Gunakan huruf saja (boleh spasi, titik, tanda hubung).';
  if(m){err.textContent=m;err.style.display='block';inp.style.borderColor='#DC2626';gsap.fromTo(inp,{x:-8},{x:0,duration:.4,ease:'elastic.out(1,.3)'});sfx('bad');if(!v)playVO('ui_nama');inp.focus();return}
  stopVO();name=v.slice(0,18);ID('pName').textContent=name;cur=0;total=0;remTotal=0;goIntro();
}
$('#inName').addEventListener('input',()=>{$('#nameErr').style.display='none';$('#inName').style.borderColor='#E2E8F0'});
$('#btnStart').onclick=begin;
$('#inName').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
$('#btnVo').onclick=goIntro;   /* ulangi: scene + voice over diputar ulang dari awal */
$('#btnOpen').onclick=openPhone;
$('#btnNext').onclick=nextStep;
$('#btnAgain').onclick=showStart;
$('#btnBoard').onclick=openBoard;
$('#btnRef').onclick=refreshLB;
$('#btnMute').onclick=e=>{sfxOn=!sfxOn;e.currentTarget.innerHTML=SVG(sfxOn?'sound':'mute');if(!sfxOn)stopVO();};
$('#sStart').addEventListener('pointerdown',()=>playVO('ui_start'),{once:true});
gsap.set('#phoneUI',{xPercent:-50,yPercent:-50,y:40});

const clock=new THREE.Clock();let lastT=0;
function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime(),dt=Math.min(t-lastT,.1);lastT=t;
  camera.position.set(cam.x+Math.sin(t*.35)*cam.amp,cam.y,cam.z);camera.lookAt(cam.lx,cam.ly,0);
  const sn=SC[cur].sc;
  if(sn.g.visible){sn.actors.forEach(a=>animActor(a,t));sn.g.children.forEach(c=>{if(c.userData.sway)c.rotation.z=Math.sin(t*1.2+c.userData.ph)*.03});if(sn.upd)sn.upd(t,dt)}
  birds.visible=clouds.visible;if(birds.visible)birds.children.forEach((b,i)=>{b.position.set(Math.cos(t*.35+i*2.1)*4.2,5+Math.sin(t*.8+i)*.3,-6+Math.sin(t*.35+i*2.1)*1.5);b.rotation.y=-(t*.35+i*2.1)+Math.PI;b.userData.w[0].rotation.z=Math.sin(t*10+i)*.6;b.userData.w[1].rotation.z=-Math.sin(t*10+i)*.6})
  if(clouds.visible)clouds.children.forEach((c,i)=>{c.position.x+=dt*.15*(i+1)*.5;if(c.position.x>6)c.position.x=-6});
  if(confetti.visible){for(let i=0;i<NC;i++){cp[i*3+1]-=cv[i];cp[i*3]+=Math.sin(t*3+i)*.004;if(cp[i*3+1]<0)cp[i*3+1]=7}cg.attributes.position.needsUpdate=true}
  renderer.render(scene,camera);
}
document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=SVG(e.dataset.i)});ID('imgJkn').src=IMG.jkn;buildHome();scene.background=NEUTRAL;resize();loop();showStart();initDB();
</script>
